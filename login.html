                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        <span>Invite Code & PIN (Optional)</span>
                    </div>
                    <span id="extra-chevron" class="extra-chevron">▼</span>
                </div>

                <div id="register-extra-fields" class="expandable-content-box" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <span>Invite Code (Optional)</span>
                        </label>
                        <div class="input-box">
                            <input type="text" id="reg-invite-code" class="input-field" placeholder="e.g. SMARTY91">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                            <span>Security PIN (For Password Recovery)</span>
                        </label>
                        <div class="input-box">
                            <input type="tel" id="reg-security-pin" class="input-field" placeholder="4-6 digit numeric PIN" maxlength="6" inputmode="numeric">
                        </div>
                    </div>
                </div>

                <button type="submit" id="btn-register-submit" class="btn-submit-primary">
                    <span>REGISTER & PLAY</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- FORGOT PASSWORD FORM -->
            <form id="form-forgot" class="auth-form" onsubmit="handleForgotPassword(event)">
                <div style="text-align: center; margin-bottom: 2px;">
                    <div style="font-weight: 700; font-size: 0.95rem; color: #ffffff;">Reset Password</div>
                    <div style="font-size: 0.74rem; color: var(--text-muted);">Enter registered mobile & security PIN</div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <span>Registered Mobile Number</span>
                    </label>
                    <div class="input-box">
                        <div class="input-prefix">
                            <span>🇮🇳</span>
                            <span>+91</span>
                        </div>
                        <input type="tel" id="forgot-phone" class="input-field" placeholder="Enter 10-digit mobile number" maxlength="10" required inputmode="numeric">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        <span>Security PIN</span>
                    </label>
                    <div class="input-box">
                        <input type="tel" id="forgot-pin" class="input-field" placeholder="4-6 digit numeric PIN" maxlength="6" required inputmode="numeric">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <span>New Password</span>
                    </label>
                    <div class="input-box">
                        <input type="password" id="forgot-new-pass" class="input-field" placeholder="At least 6 characters" minlength="6" required>
                        <div class="btn-toggle-eye" onclick="togglePasswordVisibility('forgot-new-pass')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <span>Confirm New Password</span>
                    </label>
                    <div class="input-box">
                        <input type="password" id="forgot-confirm-pass" class="input-field" placeholder="Re-enter new password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" id="btn-forgot-submit" class="btn-submit-primary">
                    <span>UPDATE PASSWORD</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

                <div style="text-align: center; margin-top: 4px;">
                    <a href="javascript:void(0)" class="forgot-link" onclick="switchTab('login')">← Back to Login</a>
                </div>
            </form>
        </div>

        <!-- 5. Trust Badges Footer -->
        <div class="trust-footer">
            <div class="trust-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="M9 12l2 2 4-4"></path>
                </svg>
                <span class="trust-item-title">256-Bit SSL</span>
                <span class="trust-item-desc">Secure</span>
            </div>
            <div class="trust-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span class="trust-item-title">Instant UPI</span>
                <span class="trust-item-desc">Deposit</span>
            </div>
            <div class="trust-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="6"></circle>
                    <path d="M12 5l1 2 2.5.4-1.8 1.7.4 2.4-2.1-1.1-2.1 1.1.4-2.4-1.8-1.7 2.5-.4z" fill="#FFD700"></path>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                </svg>
                <span class="trust-item-title">Fair Draws</span>
                <span class="trust-item-desc">Guaranteed</span>
            </div>
        </div>

        <div id="toast-box" class="toast-popup"></div>
    </div>

    <script>
        function showToast(msg, duration = 3000) {
            const toast = document.getElementById('toast-box');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }

        function switchTab(tab) {
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formReg = document.getElementById('form-register');
            const formForgot = document.getElementById('form-forgot');
            const tabBar = document.getElementById('auth-tab-bar');

            if (tab === 'login') {
                if (tabBar) tabBar.style.display = 'grid';
                if (tabLogin) tabLogin.classList.add('active');
                if (tabReg) tabReg.classList.remove('active');
                if (formLogin) formLogin.classList.add('active');
                if (formReg) formReg.classList.remove('active');
                if (formForgot) formForgot.classList.remove('active');
            } else if (tab === 'register') {
                if (tabBar) tabBar.style.display = 'grid';
                if (tabLogin) tabLogin.classList.remove('active');
                if (tabReg) tabReg.classList.add('active');
                if (formLogin) formLogin.classList.remove('active');
                if (formReg) formReg.classList.add('active');
                if (formForgot) formForgot.classList.remove('active');
            } else if (tab === 'forgot') {
                if (tabBar) tabBar.style.display = 'none';
                if (formLogin) formLogin.classList.remove('active');
                if (formReg) formReg.classList.remove('active');
                if (formForgot) formForgot.classList.add('active');
            }
        }

        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (field) {
                field.type = field.type === 'password' ? 'text' : 'password';
            }
        }

        function toggleRegisterExtra() {
            const box = document.getElementById('register-extra-fields');
            const chevron = document.getElementById('extra-chevron');
            if (!box) return;
            if (box.style.display === 'none' || box.style.display === '') {
                box.style.display = 'flex';
                if (chevron) chevron.style.transform = 'rotate(180deg)';
            } else {
                box.style.display = 'none';
                if (chevron) chevron.style.transform = 'rotate(0deg)';
            }
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('btn-login-submit');

            if (!phone || phone.length !== 10) {
                showToast('Please enter a valid 10-digit mobile number');
                return;
            }
            if (!password) {
                showToast('Please enter your password');
                return;
            }

            if (window.SmartyLoader && typeof window.SmartyLoader.show === 'function') {
                window.SmartyLoader.show('Verifying Credentials...');
            }
            if (submitBtn) submitBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();

                if (window.SmartyLoader && typeof window.SmartyLoader.hide === 'function') {
                    window.SmartyLoader.hide();
                }

                if (data.success && data.token) {
                    localStorage.setItem('smarty91_auth_token', data.token);
                    localStorage.setItem('smarty91_user_id', data.user.id);
                    localStorage.setItem('smarty91_user_phone', data.user.phone);
                    localStorage.setItem('smarty91_invite_code', data.user.inviteCode || '');
                    localStorage.setItem('smarty91_cached_balance', (data.user.balance || 0).toString());

                    showToast('Login Successful! Welcome to Smarty91!');
                    setTimeout(() => {
                        window.location.replace('index.html');
                    }, 500);
                } else {
                    showToast(data.message || 'Login failed. Please check credentials.');
                    if (submitBtn) submitBtn.disabled = false;
                }
            } catch (err) {
                if (window.SmartyLoader && typeof window.SmartyLoader.hide === 'function') {
                    window.SmartyLoader.hide();
                }
                showToast('Network error. Please check your connection.');
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        // Handle Register
        async function handleRegister(e) {
            e.preventDefault();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const inviteCode = (document.getElementById('reg-invite-code')?.value || '').trim();
            const securityPin = (document.getElementById('reg-security-pin')?.value || '').trim();
            const submitBtn = document.getElementById('btn-register-submit');

            if (!phone || phone.length !== 10) {
                showToast('Please enter a valid 10-digit mobile number');
                return;
            }
            if (!password || password.length < 6) {
                showToast('Password must be at least 6 characters');
                return;
            }
            if (password !== confirmPassword) {
                showToast('Passwords do not match');
                return;
            }

            if (window.SmartyLoader && typeof window.SmartyLoader.show === 'function') {
                window.SmartyLoader.show('Creating Account...');
            }
            if (submitBtn) submitBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, inviteCode, securityPin })
                });
                const data = await res.json();

                if (window.SmartyLoader && typeof window.SmartyLoader.hide === 'function') {
                    window.SmartyLoader.hide();
                }

                if (data.success && data.token) {
                    localStorage.setItem('smarty91_auth_token', data.token);
                    localStorage.setItem('smarty91_user_id', data.user.id);
                    localStorage.setItem('smarty91_user_phone', data.user.phone);
                    localStorage.setItem('smarty91_invite_code', data.user.inviteCode || '');
                    localStorage.setItem('smarty91_cached_balance', '0.00'); // Clean zero balance for all new registrations

                    showToast('Registration Successful! Welcome to Smarty91!');
                    setTimeout(() => {
                        window.location.replace('index.html');
                    }, 600);
                } else {
                    showToast(data.message || 'Registration failed.');
                    if (submitBtn) submitBtn.disabled = false;
                }
            } catch (err) {
                if (window.SmartyLoader && typeof window.SmartyLoader.hide === 'function') {
                    window.SmartyLoader.hide();
                }
                showToast('Network error during registration.');
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        // Handle Forgot Password
        async function handleForgotPassword(e) {
            e.preventDefault();
            const phone = document.getElementById('forgot-phone').value.trim();
            const securityPin = document.getElementById('forgot-pin').value.trim();
            const newPassword = document.getElementById('forgot-new-pass').value;
            const confirmPass = document.getElementById('forgot-confirm-pass').value;
            const submitBtn = document.getElementById('btn-forgot-submit');

            if (!phone || phone.length !== 10) {
                showToast('Please enter registered 10-digit mobile number');
                return;
            }
            if (!securityPin) {
                showToast('Please enter your security PIN');
                return;
            }
            if (!newPassword || newPassword.length < 6) {
                showToast('New password must be at least 6 characters');
                return;
            }
            if (newPassword !== confirmPass) {
                showToast('Passwords do not match');
                return;
            }

            if (window.SmartyLoader && typeof window.SmartyLoader.show === 'function') {
                window.SmartyLoader.show('Updating Password...');
            }
            if (submitBtn) submitBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, securityPin, newPassword })
                });
                const data = await res.json();

                if (window.SmartyLoader && typeof window.SmartyLoader.hide === 'function') {
                    window.SmartyLoader.hide();
                }

                if (data.success) {
                    showToast('Password reset successful! Please login.');
                    setTimeout(() => {
                        switchTab('login');
                        if (submitBtn) submitBtn.disabled = false;
                    }, 1000);
                } else {
                    showToast(data.message || 'Password reset failed. Check details.');
                    if (submitBtn) submitBtn.disabled = false;
                }
            } catch (err) {
                if (window.SmartyLoader && typeof window.SmartyLoader.hide === 'function') {
                    window.SmartyLoader.hide();
                }
                showToast('Network error while resetting password.');
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        // Check URL params e.g. login.html?ref=SM9182
        (function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const ref = params.get('ref') || params.get('invite');
            const tab = params.get('tab');
            if (ref) {
                const refInput = document.getElementById('reg-invite-code');
                if (refInput) refInput.value = ref;
                switchTab('register');
                toggleRegisterExtra();
            } else if (tab === 'register') {
                switchTab('register');
            }
        })();
    </script>
</body>
</html>
